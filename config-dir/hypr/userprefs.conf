#?  Reference 
# Configurations below are for reference ONLY
# They are not essential for HyDE to work but can be used to enhance QOL
# Copy the config line and paste it in the Users section to use it
# This is to prevent bloating users configuration files when not needed

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = on
        ignore_opacity = on
        xray = true
    }
    dim_inactive = false
    shadow {
        enabled = false
    }
}
# Zoom
windowrule = move onscreen cursor, match:class zoom, match:title menu window
windowrule = no_initial_focus on, match:class zoom, match:title Zoom Workplace # fixes audio dropdown
windowrule = no_initial_focus on, match:class zoom, match:title menu window # camera, login, more context menu ...

windowrulev2 = float, match:initial_class org.gnome.Nautilus
windowrulev2 = size 35% 70%, match:initial_class org.gnome.Nautilus

windowrulev2 = float, match:initial_title Add/Edit Citation
windowrulev2 = size 35% 70%, match:initial_title Add/Edit Citation

# Sign In - Google Accounts — Zen Browser
windowrulev2 = float, match:title Sign In - Google Accounts — Zen Browser
windowrulev2 = size 45% 45%,match:title Sign In - Google Accounts — Zen Browser
windowrulev2 = nodim,match:title Sign In - Google Accounts — Zen Browser

windowrulev2 = nodim,match:initial_class okular

windowrulev2 = opacity 1 & 1 & 1,match:initial_class steam

layerrule = blur on, match:namespace waybar
windowrulev2 = float on, match:initial_class scrcpy

workspace = special:Gemini
bind = Super, C , exec, ~/dotfiles/scripts/toggle_gemini.sh

workspace = special:Instagram
bind = Super, I , exec, ~/dotfiles/scripts/toggle_ig.sh

windowrulev2 = float, match:initial_title gemini.google.com_/app
windowrulev2 = size 75% 75%,match:initial_title gemini.google.com_/app
windowrulev2 = nodim,match:initial_title gemini.google.com_/app

windowrulev2 = tile, match:initial_title chatgpt.com_/
windowrulev2 = size 20% 100%,match:initial_title chatgpt.com_/
windowrulev2 = nodim,match:initial_title chatgpt.com_/

windowrulev2 = float, match:initial_title github.com_/copilot
windowrulev2 = size 20% 70%,match:initial_title github.com_/copilot
windowrulev2 = move 100%-w-10%,match:initial_title github.com_/copilot
windowrulev2 = nodim,match:initial_title github.com_/copilot
windowrulev2 = pin,match:initial_title github.com_/copilot

windowrulev2 = float, match:initial_title copilotchat-client
windowrulev2 = size 20% 70%,match:initial_title copilotchat-client
windowrulev2 = move 100%-w-10%,match:initial_title copilotchat-client
windowrulev2 = nodim,match:initial_title copilotchat-client
windowrulev2 = pin,match:initial_title copilotchat-client


windowrulev2 = float, match:initial_title youtube.com_/shorts/
windowrulev2 = size 20% 70%,match:initial_title youtube.com_/shorts/
windowrulev2 = move 100%-w-10%,match:initial_title youtube.com_/shorts/
windowrulev2 = nodim,match:initial_title youtube.com_/shorts/
windowrulev2 = pin,match:initial_title youtube.com_/shorts/

windowrulev2 = float, match:initial_title instagram.com_/
windowrulev2 = size 20% 80%,match:initial_title instagram.com_/
windowrulev2 = move 100%-w-10%,match:initial_title instagram.com_/
windowrulev2 = nodim,match:initial_title instagram.com_/

windowrulev2 = opacity 1 & 1 & 1,match:initial_class zen
windowrulev2 = opacity 1 & 1 & 1,match:initial_class com.mitchellh.ghostty

windowrulev2 = float, match:initial_class kitty
windowrulev2 = size 85% 85%,match:initial_class kitty
windowrulev2 = nodim,match:initial_class kitty

windowrulev2 = float, match:initial_class com.mitchellh.ghostty
windowrulev2 = size 60% 80%,match:initial_class com.mitchellh.ghostty
windowrulev2 = nodim,match:initial_class com.mitchellh.ghostty

# bindd = Super, T, d terminal emulator , exec, pkill -x kitty || kitty bash -c "tmux a || tmux"
bindd = Super, T, d terminal emulator , exec, pkill -x ghostty || ghostty -e bash -c "tmux a || tmux"


# unbind = Super, A
# bind = Super, A, exec, vicinae open
windowrulev2 = stayfocused, match:initial_class vicinae

input {
   repeat_rate = 90
   repeat_delay = 200
}
misc {
   focus_on_activate = true
}


# // █▀▀ █▄░█ █░█
# // ██▄ █░▀█ ▀▄▀

env = MANGOHUD,1
env = MANGOHUD_DLSYM,1

# Enable Wayland compatibility
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORMTHEME,xdgdesktopportal
env = QT_QPA_PLATFORM,wayland


# // █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄ █ █▄░█ █▀▀ █▀
# // █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█ ▄█

bind = Ctrl+Alt+Shift, R, pass, com\.obsproject\.Studio # toggle obs screen recording // install obs flatpak
bind = Super+Shift, G, exec, pkill -x rofi || scrPath/gamelauncher.sh # launch steam game launcher // install steam
bind = Super, Period, exec, emote # launch emoji selector // install emote
bind = Super+Alt, XF86MonBrightnessDown, exec, hyprshade on blue-light-filter # enable blue light filter // install hyprshade
bind = Super+Alt, XF86MonBrightnessUp, exec, hyprshade off # disable blue light filter // install hyprshade
bind = Super, R, exec, hyprctl dispatch closewindow address:hyprctl clients -j | jq -r --arg target rambox '.[] | select.initialtitle | testtarget; "i" | .address' | head -n 1; rambox

bind = ,mouse:276, killactive


# // █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# // █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

exec-once = swayidle -w timeout 600 'swaylock' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' # lock after 10 mins, sleep after 15 mins // install swayidle
exec-once = swayidle -w timeout 1200 'swaylock; hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' timeout 1800 'systemctl suspend' # lock and sleep after 20 mins, suspend after 30 mins // install swayidle

exec-once = libinput-gestures // install libinput-gestures

exec-once = swayosd-server # enable swayosd service
exec-once = `pkexec swayosd-libinput-backend` # swayosd service for keyboard input requires to be run in a subshell

exec-once = spotify &
exec-once = rambox &
exec-once = discord &


# // █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
