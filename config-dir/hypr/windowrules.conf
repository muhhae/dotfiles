# common modals
windowrule = float yes,  match:initial_title Open File
windowrule = float yes,  match:title Choose Files
windowrule = float yes,  match:title Save As
windowrule = float yes, match:title Confirm to replace files
windowrule = float yes, match:title File Operation Progress
windowrulev2 = float yes, match:class xdg-desktop-portal-gtk

