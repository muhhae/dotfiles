# See https://wiki.hyprland.org/Configuring/Window-Rules/

# '&' is a hyde specific shorthand for "override" \\ analogous to a reference
# This symbol indicates that the following values will override the default configuration
&=override

windowrulev2 = opacity 0.90 & 0.90 & 1,match:class firefox
windowrulev2 = opacity 0.90 & 0.90 & 1,match:class Brave-browser
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class code-oss
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class [Cc]ode
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class code-url-handler
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class code-insiders-url-handler
windowrulev2 = opacity 1 & 1 & 1,match:class kitty
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class org.kde.dolphin
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class org.kde.ark
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class nwg-look
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class qt5ct
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class qt6ct
windowrulev2 = opacity 0.80 & 0.80 & 1,match:class kvantummanager
