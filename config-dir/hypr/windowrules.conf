layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = blur on, match:namespace logout_dialog

windowrulev2 = float yes, match:title Picture-in-Picture
windowrulev2 = size 30% 30%,match:title Picture-in-Picture
windowrulev2 = move 100%-w-10,match:title Picture-in-Picture
windowrulev2 = pin,match:title Picture-in-Picture
windowrulev2 = noborder,match:title Picture-in-Picture
windowrulev2 = nodim,match:title Picture-in-Picture

windowrulev2 = float yes, match:initial_class .*Matplotlib.*
windowrulev2 = tile,match:initial_title gnome-shell

windowrulev2 = pin,match:initial_title as_toolbar
windowrulev2 = float yes, match:initial_title as_toolbar

windowrulev2 = size 70% 70%,match:initial_title Rambox
windowrulev2 = float yes, match:initial_title Rambox

windowrulev2 = float yes, match:initial_class steam
windowrulev2 = size 70% 70%,match:initial_title steam
windowrulev2 = opacity 1 & 1 & 1,match:initial_class steam

windowrulev2 = float yes, match:initial_class spotify
windowrulev2 = size 70% 70%,match:initial_class spotify
windowrulev2 = opacity 0.70 & 0.50 & 1,match:class [Ss]potify
windowrulev2 = opacity 0.70 & 0.50 & 1,match:initial_title Spotify Free
windowrulev2 = opacity 0.70 & 0.50 & 1,match:initial_title Spotify Premium

windowrulev2 = size 30% 70%,match:class blueman-manager
