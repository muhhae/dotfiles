set-environment -g TERM "tmux-256color"
set -g  default-terminal "tmux-256color"

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0

# Unbind the default prefix
unbind C-b

# Set the new prefix to Ctrl+a
set-option -g prefix C-space

# Bind Ctrl+a to send the prefix to a nested tmux session
bind-key C-space send-prefix

# no confirm on kill
bind-key & kill-window
bind-key x kill-pane

# use \ to create a vertical pane & start in current dir
unbind "%"
bind "\\" split-window -h -c "#{pane_current_path}"

# use \ to create a horizontal pane & start in current dir
unbind '"'
bind "-" split-window -v -c "#{pane_current_path}"

# start in current dir
bind-key c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf

bind -r "j" resize-pane -D 5
bind -r "k" resize-pane -U 5
bind -r "l" resize-pane -R 5
bind -r "h" resize-pane -L 5

# maximize and unmaximize pane
bind -r "m" resize-pane -Z

set -g mouse on

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# DESIGN TWEAKS

set -g pane-border-status bottom
set -g pane-border-format ""

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=black'
set -g pane-active-border-style 'fg=black'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red bold'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=white bg=default'
set -g status-right ' #T '
set -g status-right-length 50

setw -g window-status-current-style 'fg=red bg=default bold'
setw -g window-status-current-format '#[fg=black bg=red] #I #[fg=red bg=default] #W '

setw -g window-status-style 'fg=red bg=default'
setw -g window-status-format '#[fg=white bg=black] #I #[fg=white bg=default] #W '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# tpm plugin
set -g @plugin "tmux-plugins/tpm"

# tmux plugins
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "omerxx/tmux-sessionx"

set -g @resurrect-processes 'ssh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'

# initialize tpm (keep at bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
